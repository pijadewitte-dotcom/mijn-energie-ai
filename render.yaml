services:
  - type: web
    name: mijn-energie-ai
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOWI_MAC
        value: 4c75252ccdd3
      - key: MQTT_HOST
        value: mqtt.flespi.io
      - key: MQTT_PORT
        value: '8883'
      - key: APP_PASSWORD
        sync: false
      - key: MQTT_TOKEN
        sync: false
